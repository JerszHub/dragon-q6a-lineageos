#
# Radxa Dragon Q6A additions to the common GRUB boot configuration.
#
# The firmware's own device tree describes the board for Radxa's downstream kernel, so the
# mainline kernel has to be given the device tree it was built with. GRUB's android_bootimg_fs
# exposes the kernel and ramdisks of boot and vendor_boot but not the DTB section of
# vendor_boot, so the DTB is installed on the EFI system partition next to GRUB.
# TODO: expose vendor_boot's DTB through android_bootimg_fs, so that it is updated together
# with the kernel in the same slot.

insmod fdt
devicetree /dtb/qcs6490-radxa-dragon-q6a.dtb
